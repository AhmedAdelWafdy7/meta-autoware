# generated-recipes/ is mash output, never hand-edited; fixes go in
# classes/autoware-fixups.bbclass or recipes-thirdparty-bbappends/.

# Immediate expansion: the globally inherited fixups class needs this layer's path
AUTOWARE_LAYER_DIR := "${LAYERDIR}"

# In the layer, not a kas config: generated recipes do not build without these fixes.
# The class returns early for recipes it has no fix for.
INHERIT += "autoware-fixups"

BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/generated-recipes/*/*.bb \
    ${LAYERDIR}/recipes-thirdparty-bbappends/*/*.bbappend \
    ${LAYERDIR}/recipes-core/packagegroups/*.bb \
    ${LAYERDIR}/recipes-core/images/*.bb \
    ${LAYERDIR}/recipes-demo/*/*.bb \
"

BBFILE_COLLECTIONS += "autoware-core"
BBFILE_PATTERN_autoware-core = "^${LAYERDIR}/"
# Above meta-ros2-jazzy (12), which ships older autoware_*_msgs recipes with the same names
BBFILE_PRIORITY_autoware-core = "15"
LAYERSERIES_COMPAT_autoware-core = "scarthgap"

LAYERDEPENDS_autoware-core = " \
    core \
    openembedded-layer \
    meta-python \
    networking-layer \
    ros-common-layer \
    ros2-layer \
    ros2-jazzy-layer \
"
