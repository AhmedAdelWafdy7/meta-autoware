# poky (openembedded-core + bitbake) + meta-openembedded, pinned to scarthgap.
# Layer selection and pins adapted from ros/meta-ros's `build` branch
# kas/yocto/scarthgap.yml (https://github.com/ros/meta-ros/blob/build/kas/yocto/scarthgap.yml),
# trimmed to the meta-openembedded sub-layers PLAN.md Phase 3 names. Not a fork:
# only the tiny kas pointer file is adapted, none of the layer source itself.
header:
  version: 14

repos:
  openembedded-core:
    url: "https://github.com/openembedded/openembedded-core.git"
    commit: "2814f0962f56c8d1afa4de76d2895ba9b5cb767d"
    branch: "scarthgap"
    path: "layers/openembedded-core"
    layers:
      meta:

  bitbake:
    url: "https://github.com/openembedded/bitbake.git"
    branch: "2.8"
    commit: "0880963fea4d91a034e4a6e007d23f98658ab986"
    path: "layers/bitbake"
    layers:
      bitbake: "disabled"

  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded.git"
    commit: "b5874ea07d69919d9b40d59f2c2f0bbd24bc3259"
    branch: "scarthgap"
    path: "layers/meta-openembedded"
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:

local_conf_header:
  distro: |
    WARN_QA:remove = "license-exists"
