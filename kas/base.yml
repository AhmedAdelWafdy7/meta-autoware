# Release-independent settings; release pins are in kas/releases/<release>.yml
header:
  version: 14
  includes:
    - kas/releases/wrynose.yml

local_conf_header:
  distro: |
    # as in meta-ros's kas/common.yml: do_create_spdx fails on license ids without license text
    INHERIT_DISTRO:remove = "create-spdx"
