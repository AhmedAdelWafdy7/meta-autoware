# wrynose (Yocto 6.0) pins: the yocto-6.0.2 tags of openembedded-core and bitbake, and the
# meta-openembedded revision built with them. A new release is a new file here plus the
# include in kas/base.yml.
header:
  version: 14

repos:
  openembedded-core:
    url: "https://github.com/openembedded/openembedded-core.git"
    commit: "5d1aa5c806c061a2994f4decb59016610f093213"
    branch: "wrynose"
    path: "layers/openembedded-core"
    layers:
      meta:

  bitbake:
    url: "https://github.com/openembedded/bitbake.git"
    branch: "2.18"
    commit: "acfe02fa38b5da9e6a36c6cedcf91d4fcbefbfbd"
    path: "layers/bitbake"
    layers:
      bitbake: "disabled"

  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded.git"
    commit: "100027977216601000cbefc42c2ff6cf667e7b5e"
    branch: "wrynose"
    path: "layers/meta-openembedded"
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:
