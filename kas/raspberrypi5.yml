# core-image-autoware for Raspberry Pi 5. Use with: kas build kas/raspberrypi5.yml
header:
  version: 14
  includes:
    - kas/autoware.yml

machine: "raspberrypi5"

repos:
  meta-raspberrypi:
    url: "https://github.com/agherzan/meta-raspberrypi.git"
    branch: "wrynose"
    commit: "919588393f41b48cb6c5d832aa35e58a19b6762d"
    path: "layers/meta-raspberrypi"

local_conf_header:
  raspberrypi5: |
    # serial console on the debug UART
    ENABLE_UART = "1"
    # Wi-Fi/Bluetooth firmware (Cypress/Synaptics binary licenses)
    LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"
    # the public mirror has nothing for cortexa76 or ROS, and with 2 threads checking it takes hours
    SSTATE_MIRRORS = ""
  measure: |
    # ssh and systemd-analyze for tools/measure-target.sh, connmanctl to set up Wi-Fi
    EXTRA_IMAGE_FEATURES += "ssh-server-dropbear"
    IMAGE_INSTALL:append = " systemd-analyze connman-client"
