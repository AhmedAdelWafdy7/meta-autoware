# Self-hosted only: a cold Yocto build exceeds the hosted 6h limit. PRs from forks are skipped.
name: qemu

on:
  push:
    branches: [main, ci]
  pull_request:
  workflow_dispatch:

concurrency:
  group: qemu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot-test:
    strategy:
      fail-fast: false
      matrix:
        machine: [qemuarm64, qemux86-64]
    # fork PRs would run untrusted code on the self-hosted runner
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false  # keep build/ and layers/ between runs

      - name: Check runner host prerequisites
        run: tools/ci-host-check.sh

      - name: Stop stale bitbake server
        run: pkill -f "$GITHUB_WORKSPACE/layers/bitbake/bin/bitbake-server" || true  # left behind by a cancelled run

      - name: kas build
        run: kas build kas/${{ matrix.machine }}.yml:kas/ci.yml

      - name: Boot test (talker/listener)
        run: |
          kas shell kas/${{ matrix.machine }}.yml:kas/ci.yml -c \
            "bitbake qemu-helper-native:do_addto_recipe_sysroot && python3 $GITHUB_WORKSPACE/tools/boot-test.py ${{ matrix.machine }}"
