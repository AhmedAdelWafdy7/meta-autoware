# Build core-image-autoware on qemuarm64 and check an Autoware node runs on it.
# Self-hosted only, see qemu.yml.
name: autoware

on:
  push:
    branches: [master, scarthgap, wrynose, ci]
  pull_request:
  workflow_dispatch:

concurrency:
  group: autoware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot-test:
    # fork PRs would run untrusted code on the self-hosted runner
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false  # keep build/ and layers/ between runs

      - name: Check runner host prerequisites
        run: tools/ci-host-check.sh

      - name: Stop stale bitbake server
        run: pkill -f "$GITHUB_WORKSPACE/layers/bitbake/bin/bitbake-server" || true  # left behind by a cancelled run

      - name: Build core-image-autoware
        run: kas build kas/autoware.yml:kas/ci.yml

      - name: Boot test (Autoware node)
        run: |
          kas shell kas/autoware.yml:kas/ci.yml -c \
            "bitbake qemu-helper-native:do_addto_recipe_sysroot && python3 $GITHUB_WORKSPACE/tools/boot-test.py qemuarm64 --image core-image-autoware"

      - name: Compare with Autoware's images
        run: |
          # kas shell starts from a clean environment, so expand GITHUB_WORKSPACE out here
          kas shell kas/autoware.yml:kas/ci.yml -c "
            manifest=\$(bitbake-getvar --value -q DEPLOY_DIR | tail -1)/images/qemuarm64/core-image-autoware-jazzy-qemuarm64.rootfs.manifest
            for upstream in $GITHUB_WORKSPACE/results/upstream/*.json; do
              python3 $GITHUB_WORKSPACE/tools/compare-upstream.py --upstream \"\$upstream\" \
                --manifest core-image-autoware=\"\$manifest\" \
                --output $GITHUB_WORKSPACE/parity/\$(basename \"\$upstream\" .json) || exit 1
            done"
          for f in parity/*.md; do sed -n '1,/^Autoware packages in/p' "$f" >> "$GITHUB_STEP_SUMMARY"; done

      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity
          path: parity/
          if-no-files-found: ignore
