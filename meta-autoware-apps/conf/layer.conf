# Demos and example applications built on meta-autoware. Their data is not for production:
# the AWSIM map is CC-BY-NC-4.0 and the TIER IV sample data has no license stated.

BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "autoware-apps"
BBFILE_PATTERN_autoware-apps = "^${LAYERDIR}/"
BBFILE_PRIORITY_autoware-apps = "16"
LAYERSERIES_COMPAT_autoware-apps = "scarthgap"

LAYERDEPENDS_autoware-apps = "autoware-core"
